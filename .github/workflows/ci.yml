name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install LLVM 18
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y llvm-18-dev libclang-18-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set Environment Variables
        run: |
          echo "LLVM_SYS_180_PREFIX=/usr/lib/llvm-18" >> $GITHUB_ENV
          echo "/usr/lib/llvm-18/bin" >> $GITHUB_PATH

      - name: Build Workspace
        run: cargo build --workspace --verbose

      - name: Run Cargo Tests
        run: cargo test --workspace --verbose

      - name: Run GCC C Torture Execution Suite
        run: python3 stricc/tests/gcc_torture_runner.py

      - name: Run LLVM SingleSource Unit Tests
        run: python3 stricc/tests/llvm_test_suite_runner.py
